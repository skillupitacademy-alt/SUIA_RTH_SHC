<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" rx="40" fill="#f8fafc"/>
  
  <!-- Left Navigation Bar -->
  <rect x="0" y="0" width="220" height="600" rx="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="30" y="40" width="160" height="40" rx="12" fill="#1e293b"/> <!-- Brand Logo Area -->
  <rect x="30" y="110" width="160" height="35" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="155" width="160" height="35" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="200" width="160" height="35" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="245" width="160" height="35" rx="10" fill="#f1f5f9"/>
  
  <!-- Main Header -->
  <rect x="240" y="20" width="540" height="100" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="290" cy="70" r="25" fill="#cbd5e1"/> <!-- Profile Pic -->
  <rect x="330" y="55" width="180" height="12" rx="6" fill="#1e293b"/>
  <rect x="330" y="75" width="120" height="10" rx="5" fill="#94a3b8"/>
  
  <!-- Grid Content -->
  <!-- Stats Card 1 -->
  <rect x="240" y="140" width="165" height="100" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="260" y="160" width="40" height="40" rx="10" fill="#fee2e2"/>
  <rect x="310" y="165" width="70" height="10" rx="5" fill="#f87171"/>
  <rect x="310" y="185" width="40" height="8" rx="4" fill="#fca5a5"/>
  
  <!-- Stats Card 2 -->
  <rect x="425" y="140" width="165" height="100" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="445" y="160" width="40" height="40" rx="10" fill="#dcfce7"/>
  <rect x="495" y="165" width="70" height="10" rx="5" fill="#4ade80"/>
  <rect x="495" y="185" width="40" height="8" rx="4" fill="#86efac"/>
  
  <!-- Stats Card 3 -->
  <rect x="610" y="140" width="170" height="100" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="630" y="160" width="40" height="40" rx="10" fill="#dbeafe"/>
  <rect x="680" y="165" width="70" height="10" rx="5" fill="#60a5fa"/>
  <rect x="680" y="185" width="40" height="8" rx="4" fill="#93c5fd"/>
  
  <!-- Main Chart Area -->
  <rect x="240" y="260" width="540" height="320" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="270" y="290" width="150" height="14" rx="7" fill="#1e293b"/>
  
  <!-- Bar Chart Simulation -->
  <rect x="270" y="520" width="30" height="80" transform="translate(0, -80)" rx="4" fill="#f43f5e"/>
  <rect x="320" y="520" width="30" height="120" transform="translate(0, -120)" rx="4" fill="#3b82f6"/>
  <rect x="370" y="520" width="30" height="160" transform="translate(0, -160)" rx="4" fill="#10b981"/>
  <rect x="420" y="520" width="30" height="100" transform="translate(0, -100)" rx="4" fill="#f59e0b"/>
  <rect x="470" y="520" width="30" height="140" transform="translate(0, -140)" rx="4" fill="#8b5cf6"/>
  <rect x="520" y="520" width="30" height="190" transform="translate(0, -190)" rx="4" fill="#ec4899"/>
  <rect x="570" y="520" width="30" height="70" transform="translate(0, -70)" rx="4" fill="#6366f1"/>
  
  <!-- Horizontal Grid Lines -->
  <line x1="270" y1="520" x2="750" y2="520" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="270" y1="470" x2="750" y2="470" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="270" y1="420" x2="750" y2="420" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="270" y1="370" x2="750" y2="370" stroke="#f1f5f9" stroke-width="2"/>
</svg>
