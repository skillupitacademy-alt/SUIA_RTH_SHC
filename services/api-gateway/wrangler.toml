name = "platform-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Smart Placement: Execute Worker closer to backend (Singapore)
[placement]
mode = "smart"

[env.production]
workers_dev = true
vars = { ENVIRONMENT = "production", QUIZ_WEB_URL = "https://quiz-web-app-581488566988.asia-southeast1.run.app", RTH_ADMIN_URL = "https://quiz-admin-app-581488566988.asia-southeast1.run.app", SKILLUP_WEB_URL = "https://skillup-web-581488566988.asia-southeast1.run.app", SKILLUP_ADMIN_URL = "https://skillup-admin-581488566988.asia-southeast1.run.app", FACULTY_URL = "https://faculty-app-581488566988.asia-southeast1.run.app", STUDENT_FACULTY_URL = "https://faculty-app-581488566988.asia-southeast1.run.app", TUTORIAL_SERVICE_URL = "https://realtutorialhub-web-581488566988.asia-southeast1.run.app", SKILLHUBCORE_URL = "https://skillhubcore-service-581488566988.asia-southeast1.run.app", EXAM_SERVICE_URL = "https://quiz-api-server-581488566988.asia-southeast1.run.app", NOTIFICATION_URL = "https://quiz-api-server-581488566988.asia-southeast1.run.app", PLACEMENT_URL = "https://skillhub-placement-581488566988.asia-southeast1.run.app" }

[[env.production.routes]]
pattern = "user.realtutorialhub.com/*"
zone_name = "realtutorialhub.com"

[[env.production.routes]]
pattern = "admin.realtutorialhub.com/*"
zone_name = "realtutorialhub.com"

[[env.production.routes]]
pattern = "user.skillupitacademy.com/*"
zone_name = "skillupitacademy.com"

[[env.production.routes]]
pattern = "admin.skillupitacademy.com/*"
zone_name = "skillupitacademy.com"

[[env.production.routes]]
pattern = "faculty.skillupitacademy.com/*"
zone_name = "skillupitacademy.com"

[[env.production.routes]]
pattern = "api.skillupitacademy.com/*"
zone_name = "skillupitacademy.com"

[[env.production.routes]]
pattern = "api.realtutorialhub.com/*"
zone_name = "realtutorialhub.com"

[[env.production.routes]]
pattern = "api.skillhubcore.in/*"
zone_name = "skillhubcore.in"

[[env.production.routes]]
pattern = "quiz.skillhubcore.in/*"
zone_name = "skillhubcore.in"

[[env.production.routes]]
pattern = "tutorial.skillhubcore.in/*"
zone_name = "skillhubcore.in"

[[env.production.routes]]
pattern = "placement.skillhubcore.in/*"
zone_name = "skillhubcore.in"
