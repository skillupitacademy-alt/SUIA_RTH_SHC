name: k6 Load Tests

on:
  workflow_dispatch:

jobs:
  run-k6-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run exam flow
        env:
          API_URL: ${{ secrets.K6_API_URL }}
          TEST_EMAIL: ${{ secrets.K6_TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.K6_TEST_USER_PASSWORD }}
          DOMAIN_ID: ${{ secrets.K6_DOMAIN_ID }}
          DIFFICULTY: ${{ secrets.K6_DIFFICULTY }}
          QUESTION_COUNT: ${{ secrets.K6_QUESTION_COUNT }}
          STAGE_PROFILE: mini
        run: k6 run k6/exam-flow.js

      - name: Run auth flow
        env:
          API_URL: ${{ secrets.K6_API_URL }}
          TEST_EMAIL: ${{ secrets.K6_TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.K6_TEST_USER_PASSWORD }}
          LOCKOUT_EMAIL: ${{ secrets.K6_TEST_LOCKOUT_EMAIL }}
        run: k6 run k6/auth-flow.js

      - name: Run admin flow
        env:
          API_URL: ${{ secrets.K6_API_URL }}
          ADMIN_URL: ${{ secrets.K6_ADMIN_URL }}
          ADMIN_EMAIL: ${{ secrets.K6_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.K6_ADMIN_PASSWORD }}
        run: k6 run k6/admin-flow.js
