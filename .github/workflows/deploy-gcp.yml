name: Deploy to GCP Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: 'all/api/web/admin'
        default: 'all'
        type: choice
        options: [all, api, web, admin]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1

jobs:
  deploy-api:
    name: Deploy API Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'push' ||
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'api'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker
      - name: Build and push API
        run: |
          docker build             -f apps/api-server/Dockerfile             -t gcr.io/$PROJECT_ID/quiz-api-server:$GITHUB_SHA             -t gcr.io/$PROJECT_ID/quiz-api-server:latest .
          docker push gcr.io/$PROJECT_ID/quiz-api-server:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/quiz-api-server:latest
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy quiz-api-server             --image gcr.io/$PROJECT_ID/quiz-api-server:$GITHUB_SHA             --region $REGION             --platform managed             --allow-unauthenticated             --port 3000             --memory 2Gi             --cpu 2             --concurrency 1000             --max-instances 10             --min-instances 0
      - name: Get API URL
        run: |
          gcloud run services describe quiz-api-server             --region $REGION             --format 'value(status.url)'

  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-api
    if: |
      github.event_name == 'push' ||
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'web'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker
      - name: Build and push Web
        run: |
          docker build             -f apps/web-app/Dockerfile             -t gcr.io/$PROJECT_ID/quiz-web-app:$GITHUB_SHA             -t gcr.io/$PROJECT_ID/quiz-web-app:latest .
          docker push gcr.io/$PROJECT_ID/quiz-web-app:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/quiz-web-app:latest
      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy quiz-web-app             --image gcr.io/$PROJECT_ID/quiz-web-app:$GITHUB_SHA             --region $REGION             --platform managed             --allow-unauthenticated             --port 3001             --memory 1Gi             --cpu 1             --concurrency 1000             --max-instances 10

  deploy-admin:
    name: Deploy Admin App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-api
    if: |
      github.event_name == 'push' ||
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'admin'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker
      - name: Build and push Admin
        run: |
          docker build             -f apps/admin-app/Dockerfile             -t gcr.io/$PROJECT_ID/quiz-admin-app:$GITHUB_SHA             -t gcr.io/$PROJECT_ID/quiz-admin-app:latest .
          docker push gcr.io/$PROJECT_ID/quiz-admin-app:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/quiz-admin-app:latest
      - name: Deploy Admin to Cloud Run
        run: |
          gcloud run deploy quiz-admin-app             --image gcr.io/$PROJECT_ID/quiz-admin-app:$GITHUB_SHA             --region $REGION             --platform managed             --allow-unauthenticated             --port 3002             --memory 1Gi             --cpu 1             --concurrency 1000             --max-instances 10

  health-check:
    name: Verify all services
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web, deploy-admin]
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check all healthy
        run: |
          API_URL=$(gcloud run services describe quiz-api-server --region asia-south1 --format 'value(status.url)')
          WEB_URL=$(gcloud run services describe quiz-web-app --region asia-south1 --format 'value(status.url)')
          ADMIN_URL=$(gcloud run services describe quiz-admin-app --region asia-south1 --format 'value(status.url)')

          declare -A CHECKS=(
            [quiz-api-server]="$API_URL/api/health"
            [quiz-web-app]="$WEB_URL/"
            [quiz-admin-app]="$ADMIN_URL/"
          )

          for SERVICE in "${!CHECKS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CHECKS[$SERVICE]}")
            echo "$SERVICE: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "FAILED: $SERVICE"
              exit 1
            fi
          done
