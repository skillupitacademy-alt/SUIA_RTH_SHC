name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse-web:
    name: Lighthouse Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Vercel preview URL
        id: preview
        run: |
          DEPLOYMENT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID_WEB }}&teamId=${{ secrets.VERCEL_ORG_ID }}&target=preview&limit=1" \
            | jq -r '.deployments[0].url')

          if [ "$DEPLOYMENT_URL" = "null" ] || [ -z "$DEPLOYMENT_URL" ]; then
            echo "::warning::No preview URL found for Web App. Skipping Lighthouse."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            URL="https://$DEPLOYMENT_URL"
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "Preview URL: $URL"
          fi

      - name: Wait for deployment
        if: steps.preview.outputs.skip != 'true'
        run: |
          URL="${{ steps.preview.outputs.url }}/login"
          echo "Waiting for $URL to be ready..."
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deployment ready"
              exit 0
            fi
            echo "Attempt $i: $STATUS. Waiting 15s..."
            sleep 15
          done
          echo "::warning::Deployment not ready after 2 minutes. Skipping Lighthouse."
          echo "skip=true" >> $GITHUB_ENV

      - name: Run Lighthouse CI
        if: steps.preview.outputs.skip != 'true' && env.skip != 'true'
        run: |
          npm install -g @lhci/cli@0.14.0
          lhci autorun \
            --config=apps/realtutorialhub-quiz/lighthouserc.json \
            --collect.url=${{ steps.preview.outputs.url }}/login \
            --collect.url=${{ steps.preview.outputs.url }}/dashboard
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always() && steps.preview.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-web-${{ github.event.pull_request.number || github.sha }}
          path: .lighthouseci/
          retention-days: 30

      - name: Post results comment
        if: always() && steps.preview.outputs.skip != 'true' && env.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsFile = path.join(process.cwd(), '.lighthouseci', 'links.json');
            let links = {};
            if (fs.existsSync(resultsFile)) {
              links = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
            }

            const summaryFile = path.join(process.cwd(), '.lighthouseci', 'summary.json');
            let results = [];
            if (fs.existsSync(summaryFile)) {
              results = JSON.parse(fs.readFileSync(summaryFile, 'utf8'));
            }

            const formatScore = (score) => {
              const val = Math.round(score * 100);
              const label = val >= 90 ? 'GREEN' : val >= 50 ? 'AMBER' : 'RED';
              return `${label} ${val}`;
            };

            let body = `## Lighthouse Report - Web App\n<!-- lhci-web -->\n\n`;
            body += `| Page | Perf | A11y | Best Practices | SEO | Report |\n`;
            body += `|------|------|------|----------------|-----|--------|\n`;

            results.forEach(res => {
              const url = new URL(res.url).pathname;
              const link = links[res.url] || '#';
              body += `| ${url} | ${formatScore(res.performance)} | ${formatScore(res.accessibility)} | ${formatScore(res.bestPractices)} | ${formatScore(res.seo)} | [View](${link}) |\n`;
            });

            body += `\nThresholds: Perf >= 70, A11y >= 80, BP >= 80, SEO >= 80\n`;

            const failed = results.some(res =>
              res.performance < 0.7 || res.accessibility < 0.8 || res.bestPractices < 0.8 || res.seo < 0.8
            );

            if (failed) {
              body += `\nFAIL Lighthouse budget exceeded - see details above`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes('<!-- lhci-web -->'));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  lighthouse-admin:
