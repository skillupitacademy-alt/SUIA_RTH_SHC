              const link = links[res.url] || '#';
              body += `| ${url} | ${formatScore(res.performance)} | ${formatScore(res.accessibility)} | ${formatScore(res.bestPractices)} | ${formatScore(res.seo)} | [View](${link}) |\n`;
            });

            body += `\nThresholds: Perf >= 65, A11y >= 80, BP >= 80, SEO >= 70\n`;

            const failed = results.some(res =>
              res.performance < 0.65 || res.accessibility < 0.8 || res.bestPractices < 0.8 || res.seo < 0.7
            );

            if (failed) {
              body += `\nFAIL Lighthouse budget exceeded - see details above`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
