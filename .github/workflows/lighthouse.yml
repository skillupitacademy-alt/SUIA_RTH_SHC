            let body = `## Lighthouse Report - Admin App\n<!-- lhci-admin -->\n\n`;
            body += `| Page | Perf | A11y | Best Practices | SEO | Report |\n`;
            body += `|------|------|------|----------------|-----|--------|\n`;

            results.forEach(res => {
