      - name: Post results comment
        if: always() && steps.preview.outputs.skip != 'true' && env.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsFile = path.join(process.cwd(), '.lighthouseci', 'links.json');
            let links = {};
            if (fs.existsSync(resultsFile)) {
