name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["*"]

env:
  DATABASE_URL: postgresql://user:pass@ep-placeholder.us-east-2.aws.neon.tech/neondb
  UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
  UPSTASH_REDIS_REST_TOKEN: placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pnpm version from package.json
        id: pnpm_version
        run: |
          VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm_version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Guard pnpm version matches packageManager
        run: |
          REQUIRED=${{ steps.pnpm_version.outputs.version }}
          ACTUAL=$(pnpm -v)
          if [ "$REQUIRED" != "$ACTUAL" ]; then
            echo "pnpm version mismatch: required $REQUIRED, got $ACTUAL"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (all apps)
        run: pnpm lint:all

      - name: Type-check (all apps)
        run: pnpm typecheck:all

      - name: Unit Tests
        run: pnpm test:all

      - name: Build (all apps)
        run: pnpm build:all

  e2e-smoke:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pnpm version from package.json
        id: pnpm_version
        run: |
          VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm_version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Guard pnpm version matches packageManager
        run: |
          REQUIRED=${{ steps.pnpm_version.outputs.version }}
          ACTUAL=$(pnpm -v)
          if [ "$REQUIRED" != "$ACTUAL" ]; then
            echo "pnpm version mismatch: required $REQUIRED, got $ACTUAL"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke (placeholder)
        run: pnpm e2e:smoke || true

  deploy:
    needs: [quality-gates, e2e-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HOOK_WEB: ${{ secrets.VERCEL_DEPLOY_HOOK_WEB_APP }}
      HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN_APP }}
      HOOK_API: ${{ secrets.VERCEL_DEPLOY_HOOK_API_SERVER }}
    steps:
      - name: Trigger Vercel deploy hooks (web, admin, api)
        run: |
          for name in WEB ADMIN API; do
            url_var="HOOK_${name}"
            url="${!url_var}"
            if [ -z "$url" ]; then
              echo "Missing deploy hook for $name (expected env $url_var)"
              exit 1
            fi
            echo "Triggering $name deploy..."
            curl -X POST "$url"
          done
