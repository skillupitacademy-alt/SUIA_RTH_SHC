name: Deploy SkillHubCore Service

on:
  push:
    branches: [main]
    paths:
      - 'services/skillhubcore-service/**'
      - 'packages/db-people/**'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-48af6a2d-e8bb-46dd-a58
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/$PROJECT_ID/quiz-platform/skillhubcore-service:$GITHUB_SHA \
            -f services/skillhubcore-service/Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push asia-south1-docker.pkg.dev/$PROJECT_ID/quiz-platform/skillhubcore-service:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy skillhubcore-service \
            --image asia-south1-docker.pkg.dev/$PROJECT_ID/quiz-platform/skillhubcore-service:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --min-instances 1 \
            --max-instances 5 \
            --set-secrets "DATABASE_URL_PEOPLE=DATABASE_URL_PEOPLE:latest,DATABASE_DIRECT_URL_PEOPLE=DATABASE_DIRECT_URL_PEOPLE:latest,JWT_SECRET=JWT_SECRET:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,QSTASH_TOKEN=QSTASH_TOKEN:latest,INTERNAL_GATEWAY_SECRET=INTERNAL_GATEWAY_SECRET:latest"

      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe skillhubcore-service --region $REGION --project $PROJECT_ID --format 'value(status.url)')
          curl --fail --silent --show-error "$SERVICE_URL/healthz/"
