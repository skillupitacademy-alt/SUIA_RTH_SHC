name: Deploy API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_GATEWAY_SECRET: ${{ secrets.INTERNAL_GATEWAY_SECRET }}
      SKILLHUBCORE_URL: ${{ secrets.SKILLHUBCORE_URL }}
      STUDENT_FACULTY_URL: ${{ secrets.STUDENT_FACULTY_URL }}
      EXAM_SERVICE_URL: ${{ secrets.EXAM_SERVICE_URL }}
      TUTORIAL_SERVICE_URL: ${{ secrets.TUTORIAL_SERVICE_URL }}
      PAYMENT_SERVICE_URL: ${{ secrets.PAYMENT_SERVICE_URL }}
      CRM_SERVICE_URL: ${{ secrets.CRM_SERVICE_URL }}
      NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
      PLACEMENT_URL: ${{ secrets.PLACEMENT_URL }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gateway
        run: pnpm --filter @quiz/api-gateway build

      - name: Deploy with Wrangler
        run: npx wrangler deploy --env production
        working-directory: services/api-gateway

      - name: Smoke test
        run: |
          # Smoke test uses workers.dev URL
          # api.realtutorialhub.com DNS cutover pending
          curl --fail --silent --show-error \
            https://platform-api-gateway-production.realtutorialh.workers.dev/healthz
