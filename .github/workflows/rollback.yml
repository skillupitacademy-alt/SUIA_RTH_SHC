name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rolling back?'
        required: true
        type: string
      target_app:
        description: 'Which app to roll back'
        required: true
        type: choice
        options: ['all', 'api', 'web', 'admin']
        default: 'all'
      target_url:
        description: 'Specific deployment URL to roll back to (optional)'
        required: false
        type: string

jobs:
  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log Intent
        run: |
          echo "### Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "Actor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "Target App: ${{ inputs.target_app }}" >> $GITHUB_STEP_SUMMARY
          echo "Target URL: ${{ inputs.target_url || 'Latest previous' }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

      - name: Resolve Projects
        id: projects
        run: |
          TARGET="${{ inputs.target_app }}"
          PROJECTS=""
          NAMES=""

          if [[ "$TARGET" == "all" || "$TARGET" == "api" ]]; then
            PROJECTS+="${{ secrets.VERCEL_PROJECT_ID }} "
            NAMES+="quiz-platform-api-server "
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "web" ]]; then
            PROJECTS+="${{ secrets.VERCEL_PROJECT_ID_WEB }} "
            NAMES+="quiz-platform-web-app "
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "admin" ]]; then
            PROJECTS+="${{ secrets.VERCEL_PROJECT_ID_ADMIN }} "
            NAMES+="quiz-platform-admin-app "
          fi

          echo "list=$PROJECTS" >> $GITHUB_OUTPUT
          echo "names=$NAMES" >> $GITHUB_OUTPUT

      - name: Execute Rollback (Paid Mode)
        if: secrets.DEPLOYMENT_TIER == 'paid'
        run: |
          for project_id in ${{ steps.projects.outputs.list }}; do
            echo "Rolling back project: $project_id"
            npx vercel rollback ${{ inputs.target_url }} \
              --token ${{ secrets.VERCEL_TOKEN }} \
              --scope ${{ secrets.VERCEL_ORG_ID }} \
              --project $project_id \
              --yes
          done

      - name: Create Manual Rollback Issues (Free Mode)
        if: secrets.DEPLOYMENT_TIER != 'paid'
        uses: actions/github-script@v7
        with:
          script: |
            const names = "${{ steps.projects.outputs.names }}".trim().split(' ');
            const reason = "${{ github.event.inputs.reason }}";
            const actor = "${{ github.actor }}";
            const targetUrl = "${{ github.event.inputs.target_url }}";
            const org = "${{ secrets.VERCEL_ORG_ID }}";

            for (const name of names) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `ACTION REQUIRED: Manual Rollback - ${name}`,
                labels: ['rollback', 'manual-action-required'],
                body: `
            ## Rollback Required
            **App**: ${name}
            **Triggered by**: ${actor}
            **Reason**: ${reason}
            **Time**: ${new Date().toISOString()}
            **Target URL**: ${targetUrl || 'Last known-good'}

            ## Steps to Complete Rollback
            1. Open Vercel Dashboard: https://vercel.com/${org}/${name}/deployments
            2. Find the last known-good deployment
            3. Click the menu and select Promote to Production
            4. Wait ~60 seconds
            5. Close this issue when done

            ## After Rolling Back
            The health monitor will verify automatically within 15 min.

            ---
            Upgrade tip: Set DEPLOYMENT_TIER=paid in GitHub secrets to enable automatic CLI rollback.
                `
              });
            }

      - name: Health Verification
        id: health
        run: |
          TARGET="${{ inputs.target_app }}"
          TIER="${{ secrets.DEPLOYMENT_TIER }}"
          FAILED=false
          if [ "$TIER" = "paid" ]; then
            echo "METHOD=cli" >> $GITHUB_ENV
          else
            echo "METHOD=manual" >> $GITHUB_ENV
          fi

          check_health() {
            local url=$1
            local name=$2
            echo "Polling $name: $url"
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "$name is healthy"
                return 0
              fi
              echo "Attempt $i: $STATUS. Waiting 30s..."
              sleep 30
            done
            return 1
          }

          if [[ "$TARGET" == "all" || "$TARGET" == "api" ]]; then
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.VERCEL_PROJECT_NAME }}.vercel.app/api/health/ready" || echo "000")
            echo "API_STATUS=$API_STATUS" >> $GITHUB_ENV
            if ! check_health "https://${{ secrets.VERCEL_PROJECT_NAME }}.vercel.app/api/health/ready" "API Server"; then FAILED=true; fi
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "web" ]]; then
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.VERCEL_PROJECT_NAME_WEB }}.vercel.app" || echo "000")
            echo "WEB_STATUS=$WEB_STATUS" >> $GITHUB_ENV
            if ! check_health "https://${{ secrets.VERCEL_PROJECT_NAME_WEB }}.vercel.app" "Web App"; then FAILED=true; fi
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "admin" ]]; then
            ADMIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.VERCEL_PROJECT_NAME_ADMIN }}.vercel.app" || echo "000")
            echo "ADMIN_STATUS=$ADMIN_STATUS" >> $GITHUB_ENV
            if ! check_health "https://${{ secrets.VERCEL_PROJECT_NAME_ADMIN }}.vercel.app" "Admin App"; then FAILED=true; fi
          fi

          if [ "$FAILED" = "true" ]; then
            if [ "$TIER" = "paid" ]; then
              echo "Health check failed in Paid mode"
              exit 1
            else
              echo "Health check incomplete or failed in Free mode (manual rollback may still be in progress)"
              echo "RESULT=warn" >> $GITHUB_ENV
            fi
          else
            echo "RESULT=pass" >> $GITHUB_ENV
          fi

      - name: Final Summary
        if: always()
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Actor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "Target App: ${{ inputs.target_app }}" >> $GITHUB_STEP_SUMMARY
          echo "Method: ${{ env.METHOD || 'manual' }}" >> $GITHUB_STEP_SUMMARY
          echo "API Health: ${{ env.API_STATUS || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "Web Health: ${{ env.WEB_STATUS || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "Admin Health: ${{ env.ADMIN_STATUS || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ env.RESULT || 'failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
