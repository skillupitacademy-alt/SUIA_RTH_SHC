name: quiz-platform

x-common-defaults: &common-defaults
  restart: unless-stopped
  networks:
    - app_internal
  security_opt:
    - no-new-privileges:true

x-next-health-defaults: &next-health-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/platform/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/platform/nginx/conf.d:/etc/nginx/conf.d:ro
      - /opt/platform/nginx/snippets:/etc/nginx/snippets:ro
      - ${HOSTINGER_CERT_DIR:-/opt/platform/nginx/certs}:/etc/nginx/certs:ro
      - ${HOSTINGER_LOG_DIR:-/opt/platform/logs}/nginx:/var/log/nginx
    depends_on:
      question-judge:
        condition: service_healthy
      api-server:
        condition: service_healthy
      realtutorialhub-quiz:
        condition: service_healthy
      realtutorialhub-admin:
        condition: service_healthy
      realtutorialhub-web:
        condition: service_healthy
      skillup-web:
        condition: service_healthy
      skillup-admin:
        condition: service_healthy
      faculty-app:
        condition: service_healthy
      skillhubcore-admin:
        condition: service_healthy
      skillhub-placement:
        condition: service_healthy
      skillhubcore-service:
        condition: service_healthy
    networks:
      - edge
      - app_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api-server:
    <<: *common-defaults
    image: quiz-platform-api-server:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/services/api-server.env
    depends_on:
      question-judge:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health/live || exit 1"]

  question-judge:
    <<: *common-defaults
    image: quiz-platform-question-judge:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/services/question-judge.env
    expose:
      - "8000"
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\" || exit 1"]

  realtutorialhub-quiz:
    <<: *common-defaults
    image: quiz-platform-realtutorialhub-quiz:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/realtutorialhub.env
      - /opt/platform/env/services/realtutorialhub-quiz.env
    expose:
      - "3001"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3001/ || exit 1"]

  realtutorialhub-admin:
    <<: *common-defaults
    image: quiz-platform-realtutorialhub-admin:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/realtutorialhub.env
      - /opt/platform/env/services/realtutorialhub-admin.env
    expose:
      - "3002"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3002/api/healthz || exit 1"]

  realtutorialhub-web:
    <<: *common-defaults
    image: quiz-platform-realtutorialhub-web:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/realtutorialhub.env
      - /opt/platform/env/services/realtutorialhub-web.env
    expose:
      - "3003"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3003/ || exit 1"]

  skillup-web:
    <<: *common-defaults
    image: quiz-platform-skillup-web:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/skillup.env
      - /opt/platform/env/services/skillup-web.env
    expose:
      - "3004"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3004/api/healthz || exit 1"]

  skillup-admin:
    <<: *common-defaults
    image: quiz-platform-skillup-admin:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/skillup.env
      - /opt/platform/env/services/skillup-admin.env
    expose:
      - "3005"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3005/api/healthz || exit 1"]

  faculty-app:
    <<: *common-defaults
    image: quiz-platform-faculty-app:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/skillup.env
      - /opt/platform/env/services/faculty-app.env
    expose:
      - "3006"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3006/api/healthz || exit 1"]

  skillhubcore-admin:
    <<: *common-defaults
    image: quiz-platform-skillhubcore-admin:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/skillhubcore.env
      - /opt/platform/env/services/skillhubcore-admin.env
    expose:
      - "3000"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]

  skillhub-placement:
    <<: *common-defaults
    image: quiz-platform-skillhub-placement:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/skillhubcore.env
      - /opt/platform/env/services/skillhub-placement.env
    expose:
      - "3008"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3008/api/healthz || exit 1"]

  skillhubcore-service:
    <<: *common-defaults
    image: quiz-platform-skillhubcore-service:latest
    env_file:
      - /opt/platform/env/shared/.env
      - /opt/platform/env/brands/skillhubcore.env
      - /opt/platform/env/services/skillhubcore-service.env
    expose:
      - "3000"
    healthcheck:
      <<: *next-health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/healthz/ || exit 1"]

networks:
  edge:
    name: quiz_platform_edge
  app_internal:
    name: quiz_platform_internal
