services:
  nginx:
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  api-server:
    mem_limit: 2048m
    cpus: "2.00"
    logging: &app-logging
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  realtutorialhub-quiz:
    mem_limit: 1024m
    cpus: "1.00"
    logging: *app-logging

  realtutorialhub-admin:
    mem_limit: 1024m
    cpus: "1.00"
    logging: *app-logging

  realtutorialhub-web:
    mem_limit: 1024m
    cpus: "1.00"
    logging: *app-logging

  skillup-web:
    mem_limit: 768m
    cpus: "1.00"
    logging: *app-logging

  skillup-admin:
    mem_limit: 768m
    cpus: "1.00"
    logging: *app-logging

  faculty-app:
    mem_limit: 768m
    cpus: "1.00"
    logging: *app-logging

  skillhubcore-admin:
    mem_limit: 768m
    cpus: "1.00"
    logging: *app-logging

  skillhub-placement:
    mem_limit: 768m
    cpus: "1.00"
    logging: *app-logging

  skillhubcore-service:
    mem_limit: 768m
    cpus: "1.00"
    logging: *app-logging
