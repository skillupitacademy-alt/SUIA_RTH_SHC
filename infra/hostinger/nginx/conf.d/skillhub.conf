server {
    listen 443 ssl http2;
    server_name placement.skillhubcore.in origin-placement.skillhubcore.in;
    include /etc/nginx/snippets/ssl-origin.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
