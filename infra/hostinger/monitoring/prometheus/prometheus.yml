global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: nginx-exporter
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: public-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://user.realtutorialhub.com/
          - https://admin.realtutorialhub.com/login
          - https://api.realtutorialhub.com/internal/health
          - https://user.skillupitacademy.com/
          - https://admin.skillupitacademy.com/login
          - https://faculty.skillupitacademy.com/login
          - https://api.skillupitacademy.com/internal/health
          - https://quiz.skillhubcore.in/
          - https://tutorial.skillhubcore.in/
          - https://admin.skillhubcore.in/login
          - https://api.skillhubcore.in/internal/health
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
