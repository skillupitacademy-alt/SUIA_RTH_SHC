groups:
  - name: hostinger-vps
    rules:
      - alert: VpsDiskUsageHigh
        expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} * 100) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VPS disk usage is above 80%

      - alert: VpsDiskUsageCritical
        expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} * 100) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: VPS disk usage is above 90%

      - alert: VpsMemoryUsageHigh
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VPS memory usage is above 85%

      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Docker container has not reported metrics recently

      - alert: PublicEndpointDown
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: Public endpoint probe is failing
