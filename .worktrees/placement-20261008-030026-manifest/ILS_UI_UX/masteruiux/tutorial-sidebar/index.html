<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tutorial Engine</title>


  <!-- ========================================================
       INTER FONT
       ======================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ========================================================
       FONT AWESOME
       ======================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- ========================================================
       SIDEBAR CSS
       ======================================================== -->

  <link
    rel="stylesheet"
    href="sidebar.css"
  >

</head>


<body>


  <!-- ========================================================
       TUTORIAL SIDEBAR
       ======================================================== -->

  <aside
    class="sidebar"
    id="tutorialSidebar"
    aria-label="Tutorial navigation"
  >


    <!-- ======================================================
         BRAND
         ====================================================== -->

    <header class="brand-header">

      <div
        class="brand-logo"
        id="brandLogo"
        aria-label="Brand logo"
      >
        <!-- Generated by sidebar.js -->
      </div>


      <div class="brand-info">

        <h1 id="brandName">
          Loading...
        </h1>

        <p id="brandTagline">
          Loading...
        </p>

      </div>

    </header>


    <!-- ======================================================
         CURRENT SUBJECT

         IMPORTANT:
         This is the ONLY place where JavaScript appears
         as the subject/header.

         JavaScript must NOT be rendered again inside
         the curriculum tree.
         ====================================================== -->

    <section
      class="subject-section"
      aria-label="Current subject"
    >

      <div class="subject-tag">

        <span
          class="subject-icon"
          id="subjectIcon"
          aria-hidden="true"
        >
        </span>


        <span
          class="subject-title"
          id="subjectTitle"
        >
          Loading...
        </span>

      </div>

    </section>


    <!-- ======================================================
         PROGRESS
         ====================================================== -->

    <section
      class="progress-section"
      aria-label="Tutorial progress"
    >

      <div class="progress-header">

        <span class="progress-title">
          Your Progress
        </span>


        <span
          class="progress-percentage"
          id="progressPercentage"
        >
          0%
        </span>

      </div>


      <div
        class="progress-bar-bg"
        id="progressBar"
        role="progressbar"
        aria-label="Tutorial progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >

        <div
          class="progress-bar-fill"
          id="progressBarFill"
        ></div>

      </div>

    </section>


    <!-- ======================================================
         CURRICULUM NAVIGATION

         The tree starts BELOW the JavaScript subject header.

         Example:

         JavaScript
         │
         ├── JavaScript Fundamentals
         │   ├── What Is JavaScript?
         │   ├── JavaScript Syntax
         │   └── JavaScript Statements
         │
         ├── Variables
         │   └── Variable Scope
         │       ├── Global Scope
         │       └── Function Scope
         │
         ├── Functions
         │   └── What Is Function?
         │       ├── Definition
         │       ├── Explanation
         │       └── Characteristics
         │
         ├── ECMAScript
         │   ├── ES5
         │   └── ES6
         │
         ├── DOM
         │
         ├── Events
         │
         └── Asynchronous JavaScript

         sidebar.js recursively renders children at ANY depth.
         ====================================================== -->

    <nav
      class="curriculum-navigation"
      id="curriculumNavigation"
      aria-label="Tutorial curriculum"
    >

      <div
        class="curriculum-scroll-area"
        id="curriculumScrollArea"
      >

        <div
          class="curriculum-tree"
          id="navigationTree"
        >
          <!-- Generated recursively by sidebar.js -->
        </div>

      </div>

    </nav>


  </aside>


  <!-- ========================================================
       JAVASCRIPT
       ======================================================== -->

  <script
    src="sidebar.js"
    defer
  ></script>


</body>

</html>
