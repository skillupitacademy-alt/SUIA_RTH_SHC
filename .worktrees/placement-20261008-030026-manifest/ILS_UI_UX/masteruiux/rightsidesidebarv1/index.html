<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Dashboard Metrics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Toggle Button -->
  <button id="sidebar-toggle-btn" class="toggle-btn" aria-label="Toggle Telemetry Sidebar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    
  </button>

  <!-- Overlay (Backdrop) -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Right Side Slide-over Panel -->
  <aside id="metrics-sidebar" class="metrics-sidebar">
    <div class="sidebar-header">
      <h3 class="sidebar-title">Telemetry Overview</h3>
      <button id="close-sidebar-btn" class="close-btn" aria-label="Close Sidebar">&times;</button>
    </div>

    <div class="sidebar-scroll-content">
      
      <!-- Group 1: Lifecycle & Status -->
      <section class="group-section">
        <h4 class="group-title">Lifecycle & Status</h4>
        <div class="grid-2x2">
          
          <div class="kpi-card-square">
            <div class="icon-avatar bg-pink">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">First Viewed</span>
              <h5 class="card-val" id="ts-first">31 Aug 2026</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-pink">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Last Viewed</span>
              <h5 class="card-val" id="ts-last">31 Aug 2026</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-pink">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Completed At</span>
              <h5 class="card-val" id="ts-complete">31 Aug 2026</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-pink">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Status</span>
              <h5 class="card-val text-green" id="block-status">COMPLETED</h5>
            </div>
          </div>

        </div>
      </section>

      <!-- Group 2: Engagement Metrics -->
      <section class="group-section">
        <h4 class="group-title">Engagement Metrics</h4>
        <div class="grid-2x2">
          
          <div class="kpi-card-square">
            <div class="icon-avatar bg-orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Visit Count</span>
              <h5 class="card-val" id="visit-count">3</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Revision Count</span>
              <h5 class="card-val" id="revision-count">2</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Attempts</span>
              <h5 class="card-val" id="attempts-count">1</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Score</span>
              <h5 class="card-val" id="score-val">null</h5>
            </div>
          </div>

        </div>
      </section>

      <!-- Group 3: Time Performance -->
      <section class="group-section">
        <h4 class="group-title">Time Performance</h4>
        <div class="grid-2x2">
          
          <div class="kpi-card-square">
            <div class="icon-avatar bg-pink">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Active Time</span>
              <h5 class="card-val" id="active-time">185s</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Target Time</span>
              <h5 class="card-val" id="target-time">120s</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-pink">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Difference</span>
              <h5 class="card-val" id="time-diff">+65s</h5>
            </div>
          </div>

          <div class="kpi-card-square">
            <div class="icon-avatar bg-orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            </div>
            <div class="card-content">
              <span class="card-label">Performance %</span>
              <h5 class="card-val" id="perf-pct">154.17%</h5>
            </div>
          </div>

        </div>
      </section>

    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
