<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Definition + Visual Concept | Tutorial Engine
  </title>


  <!-- ========================================================
       INTER FONT
       ======================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ========================================================
       FONT AWESOME
       ======================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- ========================================================
       PAGE CSS
       ======================================================== -->

  <link
    rel="stylesheet"
    href="definition.css"
  >

</head>


<body>


  <!-- ========================================================
       DEFINITION + VISUAL CONCEPT PAGE
       ======================================================== -->

  <main
    class="tutorial-page"
    id="definitionVisualPage"
  >


    <!-- ======================================================
         PAGE HEADER
         ====================================================== -->

    <header
      class="page-header"
    >


      <!-- ----------------------------------------------------
           CATEGORY
           ---------------------------------------------------- -->

      <div
        class="tutorial-category"
      >

        <span
          class="category-icon"
          aria-hidden="true"
        >

          <i
            class="fa-solid fa-book-open"
          ></i>

        </span>


        <span
          id="category"
        >
          Loading...
        </span>

      </div>


      <!-- ----------------------------------------------------
           TITLE
           ---------------------------------------------------- -->

      <h1
        id="title"
      >
        Loading...
      </h1>


      <!-- ----------------------------------------------------
           TITLE UNDERLINE
           ---------------------------------------------------- -->

      <div
        class="heading-underline"
        aria-hidden="true"
      ></div>


      <!-- ----------------------------------------------------
           INTRODUCTION
           ---------------------------------------------------- -->

      <p
        class="page-introduction"
        id="introduction"
      >
        Loading...
      </p>

    </header>



    <!-- ======================================================
         DEFINITION CARD
         ====================================================== -->

    <section
      class="definition-card"
      aria-labelledby="definitionHeading"
    >


      <div
        class="definition-icon"
        aria-hidden="true"
      >

        <i
          class="fa-solid fa-book"
        ></i>

      </div>


      <div
        class="definition-divider"
        aria-hidden="true"
      ></div>


      <div
        class="definition-content"
      >

        <h2
          id="definitionHeading"
        >
          Definition
        </h2>


        <p
          id="definition"
        >
          Loading...
        </p>

      </div>

    </section>



    <!-- ======================================================
         EXPLANATION
         ====================================================== -->

    <section
      class="explanation-section"
      aria-labelledby="explanationHeading"
    >


      <div
        class="section-heading"
      >

        <span
          class="section-icon"
          aria-hidden="true"
        >

          <i
            class="fa-regular fa-comment-dots"
          ></i>

        </span>


        <h2
          id="explanationHeading"
        >
          Explanation
        </h2>

      </div>


      <div
        class="explanation-content"
        id="explanation"
      >
        <!-- Generated by definition-visual.js -->
      </div>

    </section>



    <!-- ======================================================
         VISUAL CONCEPT
         ====================================================== -->

    <section
      class="visual-section"
      aria-labelledby="visualHeading"
    >


      <!-- ----------------------------------------------------
           SECTION HEADING
           ---------------------------------------------------- -->

      <div
        class="section-heading"
      >

        <span
          class="section-icon"
          aria-hidden="true"
        >

          <i
            class="fa-solid fa-diagram-project"
          ></i>

        </span>


        <h2
          id="visualHeading"
        >
          Visual Concept
        </h2>

      </div>



      <!-- ----------------------------------------------------
           VISUAL INTRODUCTION
           ---------------------------------------------------- -->

      <p
        class="visual-introduction"
        id="visualIntroduction"
      >
        Loading...
      </p>



      <!-- ----------------------------------------------------
           VISUAL MODEL
           
           The actual visual model is generated dynamically
           from JSON by definition-visual.js.

           This makes the visual component reusable for
           different concepts.

           Example:

           Name
             │
             ▼
           Object
             │
             ▼
           Value
           
           Another topic can use a completely different
           visual structure without changing the HTML.
           ---------------------------------------------------- -->

      <div
        class="visual-model-card"
        id="visualModel"
        aria-label="Visual concept model"
      >
        <!-- Generated by definition-visual.js -->
      </div>



      <!-- ----------------------------------------------------
           VISUAL EXPLANATION
           ---------------------------------------------------- -->

      <div
        class="visual-explanation"
        id="visualExplanation"
      >
        <!-- Generated by definition-visual.js -->
      </div>

    </section>



    <!-- ======================================================
         KEY TAKEAWAY
         ====================================================== -->

    <section
      class="takeaway-card"
      aria-labelledby="takeawayHeading"
    >


      <div
        class="takeaway-content"
      >


        <div
          class="takeaway-header"
        >

          <span
            class="takeaway-icon"
            aria-hidden="true"
          >

            <i
              class="fa-solid fa-lightbulb"
            ></i>

          </span>


          <h2
            id="takeawayHeading"
          >
            Key Takeaway
          </h2>

        </div>


        <p
          id="takeaway"
        >
          Loading...
        </p>

      </div>


      <!-- ----------------------------------------------------
           DECORATIVE BULB
           ---------------------------------------------------- -->

      <div
        class="takeaway-bulb"
        aria-hidden="true"
      >

        <i
          class="fa-regular fa-lightbulb"
        ></i>

      </div>

    </section>


  </main>



  <!-- ========================================================
       JAVASCRIPT
       ======================================================== -->

  <script
    src="definition.js"
    defer
  ></script>


</body>

</html>
