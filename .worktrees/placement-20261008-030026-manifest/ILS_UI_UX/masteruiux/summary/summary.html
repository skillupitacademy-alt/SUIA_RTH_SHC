<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Tutorial Summary
  </title>


  <!-- ======================================================
       INTER FONT
       ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ======================================================
       FONT AWESOME
       ====================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- ======================================================
       SUMMARY PAGE CSS
       ====================================================== -->

  <link
    rel="stylesheet"
    href="summary.css"
  >

</head>


<body>


  <!-- ======================================================
       SUMMARY PAGE
       ====================================================== -->

  <main
    class="summary-page"
    id="summaryPage"
  >


    <!-- ====================================================
         PAGE HEADER
         ==================================================== -->

    <header
      class="summary-header"
      id="summaryHeader"
    >

      <div
        class="section-badge"
        id="pageBadge"
      >

        <i
          id="pageBadgeIcon"
          class="fa-solid fa-book-open"
          aria-hidden="true"
        ></i>

        <span id="pageBadgeText">
          REVISION &amp; SUMMARY
        </span>

      </div>


      <h1
        id="pageTitle"
        class="page-title"
      >
        Loading...
      </h1>


      <div
        class="title-underline"
        aria-hidden="true"
      ></div>


      <p
        id="pageIntroduction"
        class="page-introduction"
      >
        Loading...
      </p>

    </header>


    <!-- ====================================================
         SUMMARY SECTION
         ==================================================== -->

    <section
      class="content-section summary-section"
      aria-labelledby="summaryHeading"
    >

      <div
        class="section-heading"
      >

        <div
          class="section-heading-icon"
        >

          <i
            class="fa-regular fa-file-lines"
            aria-hidden="true"
          ></i>

        </div>


        <h2
          id="summaryHeading"
        >
          Summary
        </h2>

      </div>


      <div
        class="summary-list"
        id="summaryList"
      >
        <!-- Generated by summary.js -->
      </div>

    </section>


    <!-- ====================================================
         REVISION TABLE
         ==================================================== -->

    <section
      class="content-section revision-section"
      aria-labelledby="revisionHeading"
    >

      <div
        class="section-heading"
      >

        <div
          class="section-heading-icon"
        >

          <i
            class="fa-solid fa-table-list"
            aria-hidden="true"
          ></i>

        </div>


        <h2
          id="revisionHeading"
        >
          Revision Table
        </h2>

      </div>


      <div
        class="revision-table-wrapper"
      >

        <div
          class="revision-table"
          id="revisionTable"
          role="table"
          aria-label="Revision table"
        >
          <!-- Generated by summary.js -->
        </div>

      </div>

    </section>


    <!-- ====================================================
         QUICK TIPS
         ==================================================== -->

    <section
      class="content-section tips-section"
      aria-labelledby="tipsHeading"
    >

      <div
        class="section-heading"
      >

        <div
          class="section-heading-icon tips-heading-icon"
        >

          <i
            class="fa-solid fa-lightbulb"
            aria-hidden="true"
          ></i>

        </div>


        <h2
          id="tipsHeading"
        >
          Quick Tips
        </h2>

      </div>


      <div
        class="tips-card"
        id="tipsCard"
      >
        <!-- Generated by summary.js -->
      </div>

    </section>


    <!-- ====================================================
         FINAL REVISION MESSAGE
         ==================================================== -->

    <section
      class="final-revision-tip"
      id="finalRevisionTip"
    >

      <div
        class="final-tip-icon"
      >

        <i
          class="fa-solid fa-star"
          aria-hidden="true"
        ></i>

      </div>


      <div
        class="final-tip-content"
      >

        <strong
          id="finalTipTitle"
        >
          Quick Revision Tip
        </strong>


        <span
          id="finalTipText"
        >
        </span>

      </div>

    </section>


  </main>


  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script
    src="summary.js"
    defer
  ></script>

</body>

</html>
