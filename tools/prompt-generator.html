<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Prompt Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .section-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .section-btn {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        
        .section-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .section-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
        }
        
        .generate-btn:active {
            transform: translateY(0);
        }
        
        .output-section {
            margin-top: 30px;
            display: none;
        }
        
        .output-section.show {
            display: block;
        }
        
        .output-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }
        
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .output-header h3 {
            color: #333;
        }
        
        .copy-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        
        .copy-btn:hover {
            background: #5568d3;
        }
        
        .copy-btn.copied {
            background: #10b981;
        }
        
        .prompt-text {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .info-box {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info-box p {
            color: #0c4a6e;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Content Prompt Generator</h1>
            <p>Generate perfect prompts for ChatGPT, Claude, Gemini, or DeepSeek</p>
        </div>
        
        <div class="content">
            <div class="info-box">
                <p><strong>How to use:</strong> Enter your subtopic name, select a section, and click Generate. Copy the prompt and paste it into any AI model to get perfectly formatted JSON content.</p>
            </div>
            
            <div class="input-section">
                <div class="input-group">
                    <label for="subtopic">Subtopic Name</label>
                    <input type="text" id="subtopic" placeholder="e.g., JavaScript Promises, React Hooks, CSS Flexbox" value="JavaScript Promises">
                </div>
                
                <label>Select Section</label>
                <div class="section-selector">
                    <button class="section-btn" data-section="master">Master Prompt</button>
                    <button class="section-btn" data-section="notes">1. Notes</button>
                    <button class="section-btn" data-section="layman">2. Layman</button>
                    <button class="section-btn" data-section="reallife">3. Real Life</button>
                    <button class="section-btn" data-section="technical">4. Technical</button>
                    <button class="section-btn" data-section="code">5. Code Example</button>
                    <button class="section-btn" data-section="assignment">6. Assignment</button>
                    <button class="section-btn" data-section="project">7. Project</button>
                    <button class="section-btn" data-section="quiz">8. Quiz</button>
                    <button class="section-btn" data-section="visual">9. Visual</button>
                    <button class="section-btn" data-section="practice">10. Practice Test</button>
                </div>
                
                <button class="generate-btn" onclick="generatePrompt()">Generate Prompt</button>
            </div>
            
            <div class="output-section" id="output">
                <div class="output-box">
                    <div class="output-header">
                        <h3>Generated Prompt</h3>
                        <button class="copy-btn" onclick="copyPrompt()">Copy to Clipboard</button>
                    </div>
                    <div class="prompt-text" id="promptText"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let selectedSection = null;
        
        // Section button click handler
        document.querySelectorAll('.section-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedSection = this.dataset.section;
            });
        });
        
        function generatePrompt() {
            const subtopic = document.getElementById('subtopic').value.trim();
            
            if (!subtopic) {
                alert('Please enter a subtopic name');
                return;
            }
            
            if (!selectedSection) {
                alert('Please select a section');
                return;
            }
            
            const prompt = getPromptForSection(selectedSection, subtopic);
            document.getElementById('promptText').textContent = prompt;
            document.getElementById('output').classList.add('show');
            
            // Scroll to output
            document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function copyPrompt() {
            const text = document.getElementById('promptText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy to Clipboard';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        
        function getPromptForSection(section, subtopic) {
            const prompts = {
                master: `I need you to generate educational content for a subtopic in a structured format.

**SUBTOPIC**: ${subtopic}
**TARGET AUDIENCE**: Beginners to intermediate learners
**TONE**: Clear, friendly, educational, practical

**IMPORTANT RULES**:
1. Output MUST be in valid JSON format
2. Use double quotes for all strings
3. Escape special characters properly
4. Keep explanations clear and concise
5. Use real-world examples
6. Avoid jargon unless explained
7. Include practical applications

I will ask you to generate content for different sections one by one. Each section has 8 templates. Please follow the exact structure I provide.

Are you ready? Reply "Ready" and I'll give you the first section.`,

- Replace ALL [...] placeholders with actual content
- Use \\\\n for newlines in code
- Use \\\\" for quotes in code
- Icon names: Box, Layers, Zap, Code2, CheckCircle, AlertCircle, Lightbulb, Rocket`,
