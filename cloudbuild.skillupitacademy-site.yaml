substitutions:
  _REGION: asia-south1
  _REPOSITORY: quiz-platform
  _IMAGE_NAME: skillupitacademy-site
  _SERVICE_NAME: skillupitacademy-site
  _TAG: latest
  _NEXT_PUBLIC_SUIA_META_PIXEL_ID: ""
  _NEXT_PUBLIC_SUIA_GA4_MEASUREMENT_ID: ""
  _NEXT_PUBLIC_SUIA_GTM_CONTAINER_ID: ""
  _NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
  _NEXT_PUBLIC_ANALYTICS_ENV: "production"
  _NEXT_PUBLIC_SHC_CONTENT_BASE_URL: ""
  _MARKETING_CONTENT_API_BASE_URL: ""
  _NEXT_PUBLIC_SUIA_ANALYTICS_ENDPOINT: ""

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest || true

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - -f
      - apps/skillupitacademy-site/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - --build-arg
      - NEXT_PUBLIC_SUIA_META_PIXEL_ID=${_NEXT_PUBLIC_SUIA_META_PIXEL_ID}
      - --build-arg
      - NEXT_PUBLIC_SUIA_GA4_MEASUREMENT_ID=${_NEXT_PUBLIC_SUIA_GA4_MEASUREMENT_ID}
      - --build-arg
      - NEXT_PUBLIC_SUIA_GTM_CONTAINER_ID=${_NEXT_PUBLIC_SUIA_GTM_CONTAINER_ID}
      - --build-arg
      - NEXT_PUBLIC_ANALYTICS_ENABLED=${_NEXT_PUBLIC_ANALYTICS_ENABLED}
      - --build-arg
      - NEXT_PUBLIC_ANALYTICS_ENV=${_NEXT_PUBLIC_ANALYTICS_ENV}
      - --build-arg
      - NEXT_PUBLIC_SHC_CONTENT_BASE_URL=${_NEXT_PUBLIC_SHC_CONTENT_BASE_URL}
      - --build-arg
      - MARKETING_CONTENT_API_BASE_URL=${_MARKETING_CONTENT_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUIA_ANALYTICS_ENDPOINT=${_NEXT_PUBLIC_SUIA_ANALYTICS_ENDPOINT}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "3005"
      - --set-env-vars
      - NEXT_PUBLIC_ANALYTICS_ENV=${_NEXT_PUBLIC_ANALYTICS_ENV},NEXT_PUBLIC_ANALYTICS_ENABLED=${_NEXT_PUBLIC_ANALYTICS_ENABLED},NEXT_PUBLIC_SHC_CONTENT_BASE_URL=${_NEXT_PUBLIC_SHC_CONTENT_BASE_URL},MARKETING_CONTENT_API_BASE_URL=${_MARKETING_CONTENT_API_BASE_URL},NEXT_PUBLIC_SUIA_ANALYTICS_ENDPOINT=${_NEXT_PUBLIC_SUIA_ANALYTICS_ENDPOINT}
      - --update-secrets
      - ANALYTICS_ADMIN_TOKEN=ANALYTICS_ADMIN_TOKEN:latest,SUIA_GA4_MEASUREMENT_API_SECRET=SUIA_GA4_MEASUREMENT_API_SECRET:latest,SUIA_META_CAPI_TOKEN=SUIA_META_CAPI_TOKEN:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
