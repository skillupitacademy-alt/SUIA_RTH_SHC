<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="SUIA Tutorial Engine Definition Block — D1 to D8"
  />

  <title>SUIA Definition Block — D1 to D8</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main class="tutorial-page">

    <!-- =========================================================
         PAGE HEADER
         ========================================================= -->

    <header class="page-header">

      <div class="page-header-content">

        <div class="eyebrow">
          SUIA · TUTORIAL ENGINE
        </div>

        <h1>
          Definition Block
        </h1>

        <p class="page-description">
          Explore all eight approved Definition presentation styles
          using one reusable Tutorial Engine component.
        </p>

      </div>


      <!-- Current Topic -->

      <div class="topic-badge">

        <span class="topic-badge-label">
          Current Topic
        </span>

        <strong>
          Python Variables
        </strong>

      </div>

    </header>


    <!-- =========================================================
         VERSION SELECTOR
         ========================================================= -->

    <section
      class="version-selector"
      aria-label="Definition presentation versions"
    >

      <div class="version-selector-header">

        <div>

          <span class="selector-title">
            Definition Presentation
          </span>

          <span
            id="versionCounter"
            class="selector-counter"
          >
            D1 of D8
          </span>

        </div>

      </div>


      <!-- D1 - D8 buttons generated by JS -->

      <div
        id="versionTabs"
        class="version-tabs"
      ></div>

    </section>


    <!-- =========================================================
         DEFINITION RENDERER
         ========================================================= -->

    <section
      id="definitionRenderer"
      class="definition-renderer"
      aria-live="polite"
    >
      <!--
        JavaScript dynamically renders
        D1 → D8 here.
      -->
    </section>


    <!-- =========================================================
         PREVIOUS / PROGRESS / NEXT
         ========================================================= -->

    <nav
      class="layer-navigation"
      aria-label="Definition version navigation"
    >

      <button
        id="previousButton"
        class="navigation-button navigation-button-secondary"
        type="button"
      >
        ← Previous
      </button>


      <div
        id="progressDots"
        class="progress-dots"
        aria-label="Definition version progress"
      ></div>


      <button
        id="nextButton"
        class="navigation-button navigation-button-primary"
        type="button"
      >
        Next →
      </button>

    </nav>

  </main>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="script.js"></script>

</body>
</html>
