<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Definition + Key Characteristics | Tutorial Engine
  </title>


  <!-- ========================================================
       INTER FONT
       ======================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ========================================================
       FONT AWESOME
       ======================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- ========================================================
       PAGE CSS
       ======================================================== -->

  <link
    rel="stylesheet"
    href="definition.css"
  >

</head>


<body>


  <!-- ========================================================
       DEFINITION + KEY CHARACTERISTICS PAGE
       ======================================================== -->

  <main
    class="tutorial-page"
    id="definitionCharacteristicsPage"
  >


    <!-- ======================================================
         PAGE HEADER
         ====================================================== -->

    <header
      class="page-header"
    >


      <!-- Category -->

      <div
        class="tutorial-category"
      >

        <span
          class="category-icon"
          aria-hidden="true"
        >

          <i
            class="fa-solid fa-book-open"
          ></i>

        </span>


        <span
          id="category"
        >
          Loading...
        </span>

      </div>


      <!-- Title -->

      <h1
        id="title"
      >
        Loading...
      </h1>


      <!-- Pink underline -->

      <div
        class="heading-underline"
        aria-hidden="true"
      ></div>


      <!-- Introduction -->

      <p
        class="page-introduction"
        id="introduction"
      >
        Loading...
      </p>

    </header>



    <!-- ======================================================
         DEFINITION CARD
         ====================================================== -->

    <section
      class="definition-card"
      aria-labelledby="definitionHeading"
    >


      <div
        class="definition-icon"
        aria-hidden="true"
      >

        <i
          class="fa-solid fa-book"
        ></i>

      </div>


      <div
        class="definition-divider"
        aria-hidden="true"
      ></div>


      <div
        class="definition-content"
      >

        <h2
          id="definitionHeading"
        >
          Definition
        </h2>


        <p
          id="definition"
        >
          Loading...
        </p>

      </div>

    </section>



    <!-- ======================================================
         EXPLANATION
         ====================================================== -->

    <section
      class="explanation-section"
      aria-labelledby="explanationHeading"
    >


      <div
        class="section-heading"
      >

        <span
          class="section-icon"
          aria-hidden="true"
        >

          <i
            class="fa-regular fa-comment-dots"
          ></i>

        </span>


        <h2
          id="explanationHeading"
        >
          Explanation
        </h2>

      </div>


      <div
        class="explanation-content"
        id="explanation"
      >
        <!-- Generated by definition-characteristics.js -->
      </div>

    </section>



    <!-- ======================================================
         KEY CHARACTERISTICS
         ====================================================== -->

    <section
      class="characteristics-section"
      aria-labelledby="characteristicsHeading"
    >


      <!-- Section heading -->

      <div
        class="section-heading"
      >

        <span
          class="section-icon"
          aria-hidden="true"
        >

          <i
            class="fa-solid fa-list-check"
          ></i>

        </span>


        <h2
          id="characteristicsHeading"
        >
          Key Characteristics
        </h2>

      </div>


      <!-- ====================================================
           CHARACTERISTICS GRID

           Cards are generated from JSON.

           The renderer supports any number of
           characteristics.
           ==================================================== -->

      <div
        class="characteristics-grid"
        id="characteristicsGrid"
      >
        <!-- Generated by JavaScript -->
      </div>

    </section>



    <!-- ======================================================
         KEY TAKEAWAY
         ====================================================== -->

    <section
      class="takeaway-card"
      aria-labelledby="takeawayHeading"
    >


      <div
        class="takeaway-content"
      >


        <div
          class="takeaway-header"
        >

          <span
            class="takeaway-icon"
            aria-hidden="true"
          >

            <i
              class="fa-solid fa-lightbulb"
            ></i>

          </span>


          <h2
            id="takeawayHeading"
          >
            Key Takeaway
          </h2>

        </div>


        <p
          id="takeaway"
        >
          Loading...
        </p>

      </div>


      <div
        class="takeaway-bulb"
        aria-hidden="true"
      >

        <i
          class="fa-regular fa-lightbulb"
        ></i>

      </div>

    </section>


  </main>



  <!-- ========================================================
       JAVASCRIPT
       ======================================================== -->

  <script
    src="definition.js"
    defer
  ></script>


</body>

</html>
