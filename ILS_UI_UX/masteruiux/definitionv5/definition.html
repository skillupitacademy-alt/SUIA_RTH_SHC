<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Definition + Why It Matters | Tutorial Engine
  </title>


  <!-- ========================================================
       INTER FONT
       ======================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ========================================================
       FONT AWESOME
       ======================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- ========================================================
       PAGE CSS
       ======================================================== -->

  <link
    rel="stylesheet"
    href="definition.css"
  >

</head>


<body>


  <!-- ========================================================
       DEFINITION + WHY IT MATTERS PAGE
       ======================================================== -->

  <main
    class="tutorial-page"
    id="definitionImportancePage"
  >


    <!-- ======================================================
         PAGE HEADER
         ====================================================== -->

    <header
      class="page-header"
    >


      <!-- ----------------------------------------------------
           CATEGORY
           ---------------------------------------------------- -->

      <div
        class="tutorial-category"
      >

        <span
          class="category-icon"
          aria-hidden="true"
        >

          <i
            class="fa-solid fa-book-open"
          ></i>

        </span>


        <span
          id="category"
        >
          Loading...
        </span>

      </div>


      <!-- ----------------------------------------------------
           TITLE
           ---------------------------------------------------- -->

      <h1
        id="title"
      >
        Loading...
      </h1>


      <!-- ----------------------------------------------------
           TITLE UNDERLINE
           ---------------------------------------------------- -->

      <div
        class="heading-underline"
        aria-hidden="true"
      ></div>


      <!-- ----------------------------------------------------
           INTRODUCTION
           ---------------------------------------------------- -->

      <p
        class="page-introduction"
        id="introduction"
      >
        Loading...
      </p>

    </header>



    <!-- ======================================================
         DEFINITION CARD
         ====================================================== -->

    <section
      class="definition-card"
      aria-labelledby="definitionHeading"
    >


      <!-- Definition icon -->

      <div
        class="definition-icon"
        aria-hidden="true"
      >

        <i
          class="fa-solid fa-book"
        ></i>

      </div>


      <!-- Vertical divider -->

      <div
        class="definition-divider"
        aria-hidden="true"
      ></div>


      <!-- Definition content -->

      <div
        class="definition-content"
      >

        <h2
          id="definitionHeading"
        >
          Definition
        </h2>


        <p
          id="definition"
        >
          Loading...
        </p>

      </div>

    </section>



    <!-- ======================================================
         EXPLANATION
         ====================================================== -->

    <section
      class="explanation-section"
      aria-labelledby="explanationHeading"
    >


      <div
        class="section-heading"
      >

        <span
          class="section-icon"
          aria-hidden="true"
        >

          <i
            class="fa-regular fa-comment-dots"
          ></i>

        </span>


        <h2
          id="explanationHeading"
        >
          Explanation
        </h2>

      </div>


      <div
        class="explanation-content"
        id="explanation"
      >
        <!-- Generated by definition-importance.js -->
      </div>

    </section>



    <!-- ======================================================
         WHY IS THIS IMPORTANT?
         ====================================================== -->

    <section
      class="importance-section"
      aria-labelledby="importanceHeading"
    >


      <!-- ----------------------------------------------------
           SECTION HEADING
           ---------------------------------------------------- -->

      <div
        class="section-heading"
      >

        <span
          class="section-icon"
          aria-hidden="true"
        >

          <i
            class="fa-solid fa-circle-question"
          ></i>

        </span>


        <h2
          id="importanceHeading"
        >
          Why Is This Important?
        </h2>

      </div>



      <!-- ----------------------------------------------------
           IMPORTANCE CARD
           ---------------------------------------------------- -->

      <article
        class="importance-card"
      >


        <!-- --------------------------------------------------
             IMPORTANCE ICON PANEL
             -------------------------------------------------- -->

        <div
          class="importance-visual"
          aria-hidden="true"
        >

          <div
            class="importance-visual-icon"
          >

            <i
              id="importanceIcon"
              class="fa-solid fa-lightbulb"
            ></i>

          </div>

        </div>


        <!-- --------------------------------------------------
             IMPORTANCE CONTENT
             -------------------------------------------------- -->

        <div
          class="importance-content"
        >

          <h3
            id="importanceTitle"
          >
            Loading...
          </h3>


          <div
            class="importance-description"
            id="importanceDescription"
          >
            <!-- Generated by JavaScript -->
          </div>


          <!-- ----------------------------------------------
               PRACTICAL IMPACT
               ---------------------------------------------- -->

          <div
            class="importance-impact"
          >

            <span
              class="impact-icon"
              aria-hidden="true"
            >

              <i
                class="fa-solid fa-arrow-right"
              ></i>

            </span>


            <p
              id="importanceImpact"
            >
              Loading...
            </p>

          </div>

        </div>

      </article>


    </section>



    <!-- ======================================================
         KEY TAKEAWAY
         ====================================================== -->

    <section
      class="takeaway-card"
      aria-labelledby="takeawayHeading"
    >


      <div
        class="takeaway-content"
      >


        <div
          class="takeaway-header"
        >

          <span
            class="takeaway-icon"
            aria-hidden="true"
          >

            <i
              class="fa-solid fa-lightbulb"
            ></i>

          </span>


          <h2
            id="takeawayHeading"
          >
            Key Takeaway
          </h2>

        </div>


        <p
          id="takeaway"
        >
          Loading...
        </p>

      </div>


      <!-- Decorative bulb -->

      <div
        class="takeaway-bulb"
        aria-hidden="true"
      >

        <i
          class="fa-regular fa-lightbulb"
        ></i>

      </div>

    </section>


  </main>



  <!-- ========================================================
       JAVASCRIPT
       ======================================================== -->

  <script
    src="definition.js"
    defer
  ></script>


</body>

</html>
